name: ETL a D1 (manual)

# Solo manual. Recargar los 150 mil registros en D1 gasta mucho más que las 100 000 escrituras diarias del plan
# gratuito (cada fila escribe también sus índices), así que ya no corre cada semana. Los datos se cargan en la
# máquina del grupo (etl/cargar_sqlite.py) y el Worker los consulta por el conector; D1 queda como respaldo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Descargar CSV del MEF
        run: curl -fSL --retry 3 -o DETALLE_INVERSIONES.csv https://fs.datosabiertos.mef.gob.pe/datastorefiles/DETALLE_INVERSIONES.csv
      - name: Generar SQL
        run: python etl/inversiones.py --csv DETALLE_INVERSIONES.csv --out build --fecha "$(date -u +%F)"
      - name: Instalar dependencias del Worker
        working-directory: worker
        run: npm ci
      - name: Cargar en D1
        working-directory: worker
        run: |
          set -euo pipefail
          npx wrangler d1 execute obraclara --remote --yes --file ../etl/schema.sql
          npx wrangler d1 execute obraclara --remote --yes --file ../build/meta.sql
          for f in $(ls ../build/data_*.sql | sort); do
            echo "Cargando $f"
            npx wrangler d1 execute obraclara --remote --yes --file "$f"
          done
      - name: Verificar con COUNT
        working-directory: worker
        run: npx wrangler d1 execute obraclara --remote --command "SELECT COUNT(*) AS filas FROM inversiones"
