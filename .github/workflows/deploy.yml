name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "worker/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Secreto del conector
        env:
          CONECTOR_SECRET: ${{ secrets.CONECTOR_SECRET }}
        run: if [ -n "$CONECTOR_SECRET" ]; then printf '%s' "$CONECTOR_SECRET" | npx wrangler secret put CONECTOR_SECRET; fi
      - run: npx wrangler deploy
