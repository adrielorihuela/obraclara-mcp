name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Regla: no desplegar durante las clases (miércoles y viernes 09:00–11:10, hora de Lima). Desplegar reinicia la cola del
      # Worker y desconecta el conector unos segundos; el chat lo aguanta, pero en una exposición se nota. Solo avisa, no bloquea.
      - name: Aviso de horario de clase
        working-directory: .
        run: |
          dia=$(TZ=America/Lima date +%u); hm=$(TZ=America/Lima date +%H%M)
          if { [ "$dia" = 3 ] || [ "$dia" = 5 ]; } && [ "$hm" -ge 0900 ] && [ "$hm" -le 1110 ]; then
            echo "::warning title=Despliegue en horario de clase::Son las $(TZ=America/Lima date +%H:%M) en Lima (miércoles o viernes de clase). Evita desplegar o reiniciar el conector entre 09:00 y 11:10."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Secreto del conector
        env:
          CONECTOR_SECRET: ${{ secrets.CONECTOR_SECRET }}
        run: if [ -n "$CONECTOR_SECRET" ]; then printf '%s' "$CONECTOR_SECRET" | npx wrangler secret put CONECTOR_SECRET; fi
      - run: npx wrangler deploy
