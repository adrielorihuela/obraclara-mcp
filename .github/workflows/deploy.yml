name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Regla: no desplegar durante una exposición anunciada por el usuario. Desplegar reinicia la cola del Worker y desconecta el
      # conector unos segundos; el chat lo aguanta («Reconectando…»), pero en vivo se nota. Para avisar, se activa la variable del
      # repositorio EXPOSICION_EN_CURSO (Settings → Variables). Solo avisa, no bloquea.
      - name: Aviso de exposición anunciada
        working-directory: .
        env:
          EXPOSICION: ${{ vars.EXPOSICION_EN_CURSO }}
        run: |
          if [ -n "$EXPOSICION" ] && [ "$EXPOSICION" != "0" ] && [ "$EXPOSICION" != "false" ]; then
            echo "::warning title=Despliegue durante una exposición anunciada::No desplegar durante una exposición anunciada ($EXPOSICION). El conector se desconecta unos segundos al desplegar."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Secreto del conector
        env:
          CONECTOR_SECRET: ${{ secrets.CONECTOR_SECRET }}
        run: if [ -n "$CONECTOR_SECRET" ]; then printf '%s' "$CONECTOR_SECRET" | npx wrangler secret put CONECTOR_SECRET; fi
      - run: npx wrangler deploy
